name: Deploy to Fly.io

# Deploys when a pull request is merged into main (and on demand from the Actions tab).
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; a deploy restarts the single game machine.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://goosy-race.fly.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      # pinned to flyctl-actions master (Node 24 runtime; newest tag 1.5 still targets the deprecated Node 20)
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Health check
        run: |
          for i in $(seq 1 30); do
            curl -fsS https://goosy-race.fly.dev/healthz && exit 0
            sleep 5
          done
          echo "App did not become healthy" && exit 1
