# Goosy Race on Fly.io. Change `app` to a name of your own before `fly launch`.
app = "goosy-race"
primary_region = "ams"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # the address QR codes and share links point to (change if you add a custom domain)
  PUBLIC_URL = "https://goosy-race.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Low-traffic setup: one machine that sleeps when nobody is connected (open game sockets keep it awake)
  # and wakes in a second or two on the next visit. Rooms live in memory, so never run more than one
  # machine. For always-on: auto_stop_machines = "off" and min_machines_running = 1.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[http_service.checks]]
    grace_period = "5s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
